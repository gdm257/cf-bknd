#:schema node_modules/wrangler/config-schema.json
name = "bknd"
main = "src/index.ts"
compatibility_date = "2025-08-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
minify = true

[assets]
directory = "node_modules/bknd/dist/static"

[observability]
enabled = true
# Database: D1 by default. To use an external database instead, set DATABASE_URL
# as a Worker secret (`npx wrangler secret put DATABASE_URL`) or in ".dev.vars"
# for local development — PostgreSQL (`postgres://...`) or remote SQLite, e.g.
# Turso/LibSQL (`libsql://<host>?authToken=<token>`). DATABASE_URL takes
# precedence over D1 (see config.ts); once set, the block below is no longer
# needed in production.
# Keep it while developing though — `pnpm typegen` proxies bindings from it.

[[d1_databases]]
binding = "DB"
database_name = "bknd"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bknd"
